<meta name="description" content="An open, community-built Rohingya (Hanifi script) dictionary with voice recordings, plus history, Arakan stories, education, research and admissions.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lora:wght@600;700&family=Noto+Sans+Hanifi+Rohingya&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1b2620;--mu:#66756d;--ac:#1d6a4a;--ac2:#e8f2ec;--bd:#e0ddd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b2420;--tx:#e9f0ea;--mu:#9ab0a3;--ac:#5fc795;--ac2:#22332b;--bd:#304038}}
*{box-sizing:border-box}html{scroll-padding-top:70px}body{top:0!important;margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Lora,Georgia,serif;line-height:1.25;margin:0 0 8px}
.top{position:sticky;top:0;z-index:9;background:var(--card);border-bottom:1px solid var(--bd)}
.hd{display:flex;align-items:center;gap:12px;max-width:900px;margin:auto;padding:10px 16px}.hd img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--ac)}
.nm{font:700 20px Lora,serif;color:var(--ac);flex:1}.hb{border:0;background:var(--ac2);color:var(--ac);font-size:22px;border-radius:10px;width:44px;height:40px;cursor:pointer}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}#ov.open{display:block}
nav{position:fixed;top:0;right:0;bottom:0;width:min(84%,330px);background:var(--card);border-left:1px solid var(--bd);transform:translateX(100%);transition:transform .25s;z-index:50;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 24px;display:flex;flex-direction:column}
nav.open{transform:none}
.nh{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 8px;font:700 17px Lora,serif;color:var(--ac)}.nh button{border:0;background:var(--ac2);color:var(--ac);font-size:20px;border-radius:8px;width:36px;height:36px}
#nv button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);background:none;color:var(--tx);padding:13px 18px;font:600 15px Inter,sans-serif;cursor:pointer}
#nv button.on{color:var(--ac);background:var(--ac2);border-left:4px solid var(--ac)}
#gt{padding:6px 14px 10px}.skiptranslate>iframe{display:none!important}#goog-gt-tt{display:none!important}
#ns{padding:14px 16px 0}
main{max-width:900px;margin:auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--ac),#0f3d2b);color:#fff;border-radius:16px;padding:28px 22px;margin-bottom:16px}
.hero h1{font-size:28px}.hero p{opacity:.92;margin:6px 0 16px}
.hf{font-family:'Noto Sans Hanifi Rohingya',sans-serif;direction:rtl;font-size:22px;line-height:1.8}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}.grid>.c{margin-bottom:0}
.tag{display:inline-block;font:600 11px Inter;letter-spacing:.04em;text-transform:uppercase;color:var(--ac);background:var(--ac2);padding:2px 8px;border-radius:20px;margin-bottom:6px}
.n{font:700 26px Lora,serif;color:var(--ac)}.mu{color:var(--mu);font-size:13px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px;margin:4px 0}
.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 16px;font:600 14px Inter,sans-serif;cursor:pointer;margin:2px 4px 2px 0;display:inline-block;text-decoration:none}
.b.g{background:var(--ac2);color:var(--ac)}.b.r{background:#b3372b;color:#fff}
details summary{cursor:pointer;font-weight:600}details p{margin:8px 0}a{color:var(--ac)}
.w{font-weight:700;font-size:18px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.so{display:flex;flex-wrap:wrap;gap:8px;justify-content:inherit}.so a{padding:7px 14px;border:1px solid var(--ac);border-radius:20px;font:600 13px Inter,sans-serif;text-decoration:none;color:var(--ac);background:var(--card)}
footer{max-width:900px;margin:20px auto;padding:20px 16px;color:var(--mu);font-size:13px;border-top:1px solid var(--bd);text-align:center}footer .so{justify-content:center;margin-bottom:10px}

const BIO=`Sana Ullah Sayeed Al Azizi is a teacher, administrator and educator in Cox's Bazar, Bangladesh. He founded SUS-Al-Azizi to preserve the Rohingya language and Hanifi script, to build an open community dictionary, and to make history, stories and learning resources freely available to everyone.

Early life and family: He received his early education in his home village of Timing Khali, in the Tumbru area of Maungdaw, Arakan, where he learned the Noorani Qaida and attended school up to class five. He is the son of Qari Saeed Alam, son of Haji Shamsul Haq, and the third among his brothers. His father graduated (Fazil) from Al-Jamiya Al-Islamiya Patiya, Chattogram, Bangladesh, then specialised in Qira'at at the same institution and became a Qari. After graduating he taught for about 25 years at the well-known madrasa Al-Jamia Al-Ashrafia Qasim ul-Uloom (Quansibang) in Arakan.

Religious education: At the age of 14 he travelled from Arakan to Bangladesh to begin his religious studies. In 1446 AH (2025 CE) he graduated from Al-Jamiya Al-Islamiya Patiya, Chattogram, the same institution his father attended, and sat the examination of the Hayatul Ulya Lil Jamiatil Qawmia Bangladesh board through the jamia. While studying at Patiya he also completed computer courses.

Teaching and technology: He then began teaching at Al-Jamiya Al-Islamiya Darul Ulum li-Sayyidina Bilal (may Allah be pleased with him), a well-known institution in the Rohingya camp. He later received training at Tika Lab in STEM education, robotics and artificial intelligence, and now teaches these subjects to students. He has completed a variety of technology courses, is a European Schoolnet Ambassador, and takes part in the STEM Discovery Campaign.

Current studies: He is currently pursuing Takhassus fil-Ifta (specialisation in Islamic jurisprudence and fatwa) online at Markaz Ahl-us-Sunnah wal-Jama'ah, Sargodha, Pakistan, under Mutakallim-e-Islam Maulana Muhammad Ilyas Ghuman (may Allah preserve him).`;
const BASE0=[
{cat:'History',t:'The Arakan Region: A Brief Overview',b:'Arakan (today Rakhine State, Myanmar) lies on the Bay of Bengal, between the Indian subcontinent and Southeast Asia. From the 15th century the Kingdom of Mrauk U, with trade and cultural links to Bengal, ruled the region until the Burmese conquest of 1784. Arakan was later annexed by British India after the First Anglo-Burmese War (1826) and became part of independent Burma in 1948.'},
{cat:'History',t:'Timeline: Key Dates',b:'1430: Kingdom of Mrauk U is founded. 1784: Burmese conquest of Arakan. 1826: Arakan comes under British rule. 1948: Burma gains independence. 1978: Major displacement to Bangladesh. 1982: Citizenship law excludes Rohingya from the recognised ethnic groups. 2017: Over 700,000 people flee to Bangladesh, where Cox\'s Bazar now hosts one of the world\'s largest refugee settlements.'},
{cat:'Arakan Stories',t:'Oral Tradition and Storytelling',b:'Rohingya culture has a rich oral tradition: lullabies, folk tales, proverbs and songs passed from elders to children. Many of these stories describe village life, rivers and monsoon seasons, hospitality, and faith. Recording elders telling these stories, in their own voice and language, is one of the most valuable things this archive can collect. Contribution guide coming soon.'},
{cat:'Arakan Stories',t:'Share Your Family Story',b:'Every family holds history: where they lived in Arakan, the journey, and life in the camps. Community members are invited to submit written or recorded stories. With permission, these will be reviewed and published here so future generations can learn from them.'},
{cat:'Documentaries',t:'Documentary Library (Curated)',b:'This section will list vetted documentaries, news reports and interviews about Rohingya history and life, each with a short summary and a link. The administrator can add entries from the Admin tab.'},
{cat:'Education',t:'Why Mother-Tongue Education Matters',b:'Research widely shows that children learn faster and understand more when taught first in the language they speak at home. For Rohingya children, many of whom lack access to formal schooling in their own language, simple literacy materials in Hanifi script can protect identity while supporting learning in other languages.'},
{cat:'Education',t:'Ideas for Teachers and Parents',b:'Start with everyday vocabulary: family, food, body, numbers, greetings. Pair each word with a picture and the audio recording from the dictionary. Practise short sentences, then simple stories. Review a few words daily rather than many words occasionally.'},
{cat:'Research',t:'Rohingya in Unicode',b:'The Hanifi Rohingya script was added to the Unicode Standard in version 11.0 (2018), in the block U+10D00 to U+10D3F. Unicode support allows the language to appear on phones, websites and in search engines, which is essential for future language technology.'},
{cat:'Research',t:'Why Open Language Data Helps',b:'Modern translation and speech systems learn from large collections of text and audio. Rohingya has very little such data. A verified, openly licensed dictionary of word, sentence and voice pairs can enable search, translation, keyboards and speech tools built by and for the community.'}];
const NEWART=[
{cat:'History',t:'Roots and the Colonial Era (to 1948)',b:`Muslim communities have lived in the Arakan region for many centuries, since the age of Arab and Persian trade across the Bay of Bengal. Under the Kingdom of Mrauk U (1430-1784) Muslims were a significant part of the population, alongside Buddhists and Bengali-speaking communities. Historians still debate when these communities formed and how they should be named, so readers are encouraged to consult several sources.

In 1799 the Scottish physician Francis Buchanan wrote that Muslims long settled in Arakan called themselves "Rooinga", one of the earliest widely cited written uses of the name. After the Burmese conquest of 1784 many people fled to British Bengal. When the British annexed Arakan in 1826, farmers and labourers from neighbouring Bengal moved into the fertile lowlands, and the northern townships of Maungdaw and Buthidaung became majority Muslim.

In 1942 British forces withdrew and the region split along communal lines. Violence displaced many Muslims to the north and many Buddhists to the south, leaving painful memories on both sides. Before independence some Muslim leaders asked for autonomy or inclusion in East Pakistan; the request was not granted. Burma became independent in January 1948.`},
{cat:'History',t:'From Independence to the 1982 Citizenship Law',b:`After 1948, Muslims of northern Arakan took part in public life. Several Rohingya served in parliament and government, and in the early 1960s the national broadcaster aired a programme in the Rohingya language. In 1961 a Mayu Frontier Administration was created for the northern region, but it ended after General Ne Win's military coup in 1962. Under military rule, Rohingya organisations were banned and their position grew steadily less secure.

In 1978 the army's Operation Nagamin ("Dragon King"), a national immigration check, led about 200,000 people to flee to Bangladesh. Most returned in 1979 after an agreement between the two governments, though many reported hardship and abuse. In 1982 a new Citizenship Law listed 135 "national races" and did not include the Rohingya, leaving most without full citizenship. Temporary identity papers replaced earlier registration cards, and restrictions on movement, marriage and education followed in many areas.`},
{cat:'History',t:'1991 to Today: Displacement and Resilience',b:`In 1991-92 around a quarter of a million Rohingya again crossed into Bangladesh; most were repatriated during the 1990s, though some stayed. Violence in Rakhine State in 2012 displaced more than 100,000 people, many of whom remained in camps inside Myanmar for years. From October 2016 and especially after 25 August 2017, military operations in northern Rakhine caused the largest exodus yet: more than 700,000 people fled to Bangladesh within months, joining earlier refugees in Cox's Bazar.

In 2018 the United Nations Fact-Finding Mission reported grave human rights violations and recommended that senior military officials be investigated. In 2019 The Gambia brought a case against Myanmar to the International Court of Justice under the Genocide Convention, and in January 2020 the Court ordered provisional measures to protect the Rohingya. Myanmar's authorities have rejected the allegations and the name Rohingya. Readers should check the latest status of the case.

Today, about a million Rohingya refugees live in Bangladesh, mostly in Cox's Bazar, where families, teachers and volunteers work to keep education, language and culture alive. This archive exists to support that effort.`},
{cat:'Arakan Stories',t:'Ancient Arakan: Dhanyawadi and Vesali',b:`Arakan is a narrow coastal land between the Bay of Bengal and the Arakan Yoma mountains, watered by rivers such as the Kaladan and the Mayu. Chronicles and archaeology point to early city-kingdoms, among them Dhanyawadi and later Vesali, whose rulers traded across the bay and left stone inscriptions and Buddhist and Hindu sculpture.

From about the 8th century, Arab and Persian traders sailed along these coasts, and some settled. Over the following centuries Arakan lay between powerful neighbours, the Pagan kingdom in Burma and the rulers of Bengal, and at times fell under the influence of each. Its position made it a meeting place of languages, religions and trade.`},
{cat:'Arakan Stories',t:'Mrauk U: The Golden Age (1430-1784)',b:`In 1430 King Min Saw Mon (Narameikhla), who had spent years in exile at the court of the Bengal Sultanate, returned to Arakan with Bengali military support and founded the city of Mrauk U. For more than three centuries it was a major capital and port.

Arakanese kings took Persian-style titles and minted coins with Persian script, showing close ties with Bengal. Muslims served as courtiers, soldiers and scholars, and Bengali poets such as Alaol wrote at the royal court in the 17th century. In 1660 the Mughal prince Shah Shuja sought refuge in Arakan, and his story ended in tragedy. The kingdom traded and fought with the Portuguese, the Dutch and the Mughals, and the city's stone temples, such as Shite-thaung, still stand.`},
{cat:'Arakan Stories',t:'Conquest and Colonial Rule (1784-1948)',b:`In 1784 King Bodawpaya of Burma invaded and annexed Arakan, carrying the sacred Mahamuni Buddha image to his capital. Thousands of people fled across the border into British-ruled Bengal, and Arakan's population fell sharply.

Border tensions and resistance contributed to the First Anglo-Burmese War (1824-26). Under the Treaty of Yandabo in 1826, Burma gave Arakan to the British. Akyab (today Sittwe) grew into a major rice port and migration into the fertile lowlands increased. Arakan stayed under British administration, as part of Burma, until independence in 1948.`}];

const ADM=(k,x)=>admin&&x.id?`<div style="margin-top:8px"><button class="b g" onclick="edit('${k}','${x.id}')">Edit</button><button class="b r" onclick="del('${k}','${x.id}')">Delete</button></div>`:'';
function BD(t){const p=String(t||'').split(/\n\n+/);return `<p>${E(p[0])}</p>`+(p.length>1?`<details><summary>Read the full story</summary>${p.slice(1).map(x=>`<p>${E(x)}</p>`).join('')}</details>`:'')}
const CARD=x=>`<div class="c"><span class="tag">${E(TITLE[x.cat]||x.cat||'')}</span><h3>${E(x.title)}</h3>${x.author?`<div class="mu">${E(x.author)}</div>`:''}${BD(x.body)}${x.file_url?`<a class="b" href="${E(x.file_url)}" target="_blank" rel="noopener">Open or download PDF</a>`:''}${/^https?:/.test(x.link||'')?` <a href="${E(x.link)}" target="_blank" rel="noopener">Open link</a>`:''}${ADM('lib',x)}</div>`;
function FORM(k,cat){const c=EN[k],id=ed[k],cur=id?(DATA[k]().find(x=>x.id==id)||{}):{};
 return `<details class="c" ${id?'open':''}><summary><b>${id?'Edit item':'+ Add new'}</b></summary>${c.f.map(([n,l,ty])=>n=='file'?`<label class="mu">${l}</label><input type="file" id="f_${k}_file" accept="${k=='cert'?'image/*,.pdf':'.pdf'}">${cur.file_url?'<div class="mu">A file is attached. Choose a new one to replace it.</div>':''}`:ty=='ta'?`<textarea id="f_${k}_${n}" rows="5" placeholder="${l}">${E(cur[n]||'')}</textarea>`:`<input id="f_${k}_${n}" placeholder="${l}" value="${E(cur[n]||'')}">`).join('')}<button class="b" onclick="save('${k}','${E(cat||'')}')">Save</button>${id?`<button class="b g" onclick="ed['${k}']=null;draw()">Cancel</button>`:''}<p class="mu">Separate paragraphs with a blank line.</p></details>`}
function edit(k,id){ed[k]=id;draw();setTimeout(()=>{const d=document.querySelector('details[open].c');if(d)d.scrollIntoView({block:'start'})},60)}
async function save(k,cat){const c=EN[k],row={};for(const[n]of c.f){if(n!='file')row[n]=$(`f_${k}_${n}`).value.trim()}
 if(!row[c.f[0][0]]){alert('Please fill in the first field.');return}
 if(cat)row.cat=cat;
 const fe=$(`f_${k}_file`);if(fe&&fe.files[0]){const f=fe.files[0],b=k=='cert'?'certs':'files',fn=Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),u=await SB.storage.from(b).upload(fn,f,{contentType:f.type});if(u.error){alert(u.error.message);return}row.file_url=SB.storage.from(b).getPublicUrl(fn).data.publicUrl}
 const id=ed[k],r=id?await SB.from(c.t).update(row).eq('id',id):await SB.from(c.t).insert(row);
 if(r.error){alert(r.error.message);return}ed[k]=null;await load(true)}
async function del(k,id){if(confirm('Delete this item?')){const r=await SB.from(EN[k].t).delete().eq('id',id);if(r.error)alert(r.error.message);load(true)}}
function SEC(c){const f=(seeded?lib:[...BASE.map(x=>({cat:x.cat,title:x.t,body:x.b})),...lib]).filter(x=>x.cat==c);
 return `<h2>${TITLE[c]}</h2><p class="mu">${INTRO[c]}</p>${admin?FORM('lib',c):''}${admin&&!seeded?'<div class="c"><b>Starter articles are built in.</b> Import them once so you can edit or delete them.<br><button class="b" onclick="seed()">Import starter articles</button></div>':''}<div class="grid">${f.map(CARD).join('')||'<div class="c mu">Nothing here yet.</div>'}</div>`}
async function seed(){const r=await SB.from('library').insert(BASE.map(x=>({cat:x.cat,title:x.t,body:x.b})));if(r.error){alert(r.error.message);return}await SB.from('site').upsert({key:'seeded',value:'1'});seeded=true;await load(true);alert('Imported. You can now edit or delete any article.')}
function H(){const t=words.filter(w=>w.rohingya).length;return `<div class="hero"><h1>Preserving the Rohingya language, together.</h1><p>An open, community-built dictionary with Hanifi script and voice recordings, plus a library of history, stories and learning resources.</p><button class="b" style="background:#fff;color:#0f3d2b" onclick="go('dict')">Contribute a translation</button><button class="b" style="background:rgba(255,255,255,.18)" onclick="go('lib')">Explore the library</button></div>
<div class="c" style="display:flex;gap:16px;align-items:center;margin-bottom:12px"><img class="ph" alt="Founder" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--ac)"><div><span class="tag">Founder</span><h3 class="notranslate">Sana Ullah Sayeed Al Azizi</h3><p class="mu notranslate" style="margin:0">SUS-Al-Azizi</p><p style="margin:4px 0 0">Teacher, educator and founder of this project. <a href="#" onclick="go('about');return false">About the founder</a></p></div></div>
<div class="grid"><div class="c"><div class="n">${words.length}</div><div class="mu">Words and phrases</div></div><div class="c"><div class="n">${t}</div><div class="mu">Verified translations</div></div><div class="c"><div class="n">${words.filter(w=>w.audio_url).length}</div><div class="mu">Voice recordings</div></div></div>
<h2 style="margin-top:24px">How it works</h2><div class="grid"><div class="c"><h3>1. Choose</h3><p>Pick an English or Urdu word that still needs a Rohingya translation.</p></div><div class="c"><h3>2. Write &amp; speak</h3><p>Type it in Hanifi script and record how it sounds.</p></div><div class="c"><h3>3. Review</h3><p>Our editor reviews each entry. Approved data is shared openly.</p></div></div>
${SO()?`<div class="c" style="margin-top:16px;text-align:center"><h3>Follow &amp; connect</h3>${SO()}</div>`:''}`}
const ABOUT_ADMIN=()=>admin?`<details class="c"><summary><b>Edit biography</b></summary><textarea id="ab" rows="10">${E(about||BIO)}</textarea><button class="b" onclick="saveSite('about','ab')">Save</button> <button class="b g" onclick="resetAbout()">Restore default</button></details>`:'';
function Ab(){return `<h2>About the Founder</h2>${ABOUT_ADMIN()}<div class="c"><div style="display:flex;gap:14px;align-items:center;margin-bottom:10px"><img class="ph" alt="Founder" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--ac)"><div><span class="tag">Founder</span><h3 class="notranslate" style="margin:0">Sana Ullah Sayeed Al Azizi</h3><div class="mu notranslate">SUS-Al-Azizi</div></div></div>${(about||BIO).split(/\n\n+/).map(p=>`<p>${E(p)}</p>`).join('')}</div>
<h2 style="margin-top:20px">Certificates &amp; Credentials</h2>${admin?FORM('cert'):''}${certs.length?'<div class="grid">'+certs.map(c=>`<div class="c"><h3>${E(c.title)}</h3><div class="mu">${E([c.issuer,c.year].filter(Boolean).join(' · '))}</div>${/\.(png|jpe?g|webp|gif)$/i.test(c.file_url||'')?`<a href="${E(c.file_url)}" target="_blank" rel="noopener"><img loading="lazy" src="${E(c.file_url)}" alt="${E(c.title)}" style="width:100%;border-radius:8px;margin-top:8px"></a>`:(c.file_url?`<a class="b" href="${E(c.file_url)}" target="_blank" rel="noopener">Open document</a>`:'')}${ADM('cert',c)}</div>`).join('')+'</div>':'<div class="c mu">Certificates will be shown here.</div>'}`}
async function saveSite(k,i){const x=await SB.from('site').upsert({key:k,value:$(i).value});alert(x.error?x.error.message:'Saved');load(true)}
async function resetAbout(){if(confirm('Restore the default biography?')){await SB.from('site').delete().eq('key','about');about='';load(true)}}
function S(){return `<h2 style="margin-top:24px">Learn Hanifi Rohingya</h2><p>Hanifi Rohingya is the writing system created for the Rohingya language. It is written right to left.</p><div class="c">${HAN.map(h=>`<p><b>${h[0]}:</b> ${h[1]}</p>`).join('')}</div>`}
function D(){const f=words.filter(w=>(flt=='all'||(flt=='todo'?!w.rohingya:!!w.rohingya))&&(!q||((w.en||'')+' '+(w.ur||'')+' '+(w.rohingya||'')).toLowerCase().includes(q.toLowerCase())));
 return `<h2>Dictionary</h2>${err?`<div class="c">Could not load the dictionary: ${E(err)}</div>`:''}${admin?DADM():''}<div class="row"><input id="q" placeholder="Search English, Urdu or Rohingya" value="${E(q)}" oninput="q=this.value;clearTimeout(window.tm);window.tm=setTimeout(()=>{draw();$('q').focus()},350)"><select onchange="flt=this.value;draw()"><option value="all" ${flt=='all'?'selected':''}>All entries</option><option value="todo" ${flt=='todo'?'selected':''}>Needs translation</option><option value="done" ${flt=='done'?'selected':''}>Translated</option></select></div><p class="mu">${f.length} entries${f.length>30?' (showing 30)':''}</p>`+
 (f.slice(0,30).map(w=>`<div class="c" style="margin-bottom:10px"><div class="w notranslate">${E(w.en)}</div><div class="mu notranslate" dir="auto">${E(w.ur)}</div>${w.rohingya?`<div class="hf notranslate">${E(w.rohingya)}</div>${w.audio_url?`<audio controls preload="none" style="width:100%" src="${E(w.audio_url)}"></audio>`:''}`:''}
 <details><summary class="mu">${w.rohingya?'Suggest a correction':'Add translation'}</summary><textarea class="hf" id="r_${w.id}" rows="1" placeholder="Type in Hanifi script"></textarea><input id="n_${w.id}" placeholder="Your name (optional)">
 <button class="b g" id="m_${w.id}" onclick="mic('${w.id}')">Record voice</button><button class="b" onclick="send('${w.id}')">Submit</button> <span class="mu" id="s_${w.id}"></span><p class="mu" style="margin:6px 0 0">By submitting you agree that your contribution may be reviewed and published as open data.</p></details>
 ${admin?`<details><summary class="mu">Admin: edit or delete</summary><input id="we_${w.id}_en" value="${E(w.en)}" placeholder="English"><input id="we_${w.id}_ur" value="${E(w.ur)}" placeholder="Urdu"><textarea class="hf" id="we_${w.id}_ro" rows="1" placeholder="Rohingya">${E(w.rohingya||'')}</textarea><button class="b" onclick="saveW('${w.id}')">Save</button><button class="b r" onclick="delW('${w.id}')">Delete word</button></details>`:''}</div>`).join('')||'<div class="c">No entries found.</div>')}
function DADM(){return `<details class="c"><summary><b>Admin: import words from Excel</b></summary><p class="mu">Excel or CSV with columns: English, Urdu</p><input type="file" accept=".xlsx,.csv" onchange="imp(this.files[0])"><div id="im" class="mu"></div></details>
<details class="c" ${subs.length?'open':''}><summary><b>Pending submissions (${subs.length})</b></summary>${subs.map(s=>{const w=words.find(x=>x.id==s.word_id)||{};return `<div style="border-top:1px solid var(--bd);padding:8px 0"><div class="w notranslate">${E(w.en)} <span class="mu">${E(w.ur)}</span></div><div class="hf notranslate">${E(s.text)}</div>${s.audio_url?`<audio controls preload="none" style="width:100%" src="${E(s.audio_url)}"></audio>`:''}<div class="mu">By ${E(s.by_name||'Anonymous')}</div><button class="b" onclick="ok('${s.id}')">Approve</button><button class="b r" onclick="rej('${s.id}')">Reject</button></div>`}).join('')||'<p class="mu">Nothing to review.</p>'}</details>`}
async function saveW(id){const x=await SB.from('words').update({en:$(`we_${id}_en`).value.trim(),ur:$(`we_${id}_ur`).value.trim(),rohingya:$(`we_${id}_ro`).value.trim()||null}).eq('id',id);if(x.error)alert(x.error.message);else load(true)}
async function delW(id){if(confirm('Delete this word?')){await SB.from('words').delete().eq('id',id);load(true)}}
async function mic(id){const b=$('m_'+id);if(rec){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(st),ch=[];rec=mr;mr.ondataavailable=e=>ch.push(e.data);
 mr.onstop=()=>{clearTimeout(mr.tt);st.getTracks().forEach(t=>t.stop());last={id,blob:new Blob(ch,{type:mr.mimeType||'audio/webm'})};rec=null;b.textContent='Recorded. Tap to re-record'};mr.start();mr.tt=setTimeout(()=>{if(rec)rec.stop()},30000);b.textContent='Stop recording (max 30s)'}catch(e){alert('Microphone permission was not granted.')}}
async function send(id){const s=$('s_'+id),t=$('r_'+id).value.trim(),nm=$('n_'+id).value.trim().slice(0,80),r=last&&last.id==id?last:null;
 if(!t&&!r){s.textContent='Add a translation or a recording.';return}
 s.textContent='Sending...';let url=null,warn='';
 if(r){const ty=r.blob.type||'audio/webm',fn=Date.now()+'-'+Math.random().toString(36).slice(2,8)+(ty.includes('mp4')?'.m4a':'.webm');
  const u=await SB.storage.from('audio').upload(fn,r.blob,{contentType:ty});if(u.error)warn=' (Audio could not be saved.)';else url=SB.storage.from('audio').getPublicUrl(fn).data.publicUrl}
 const x=await SB.from('submissions').insert({word_id:id,text:t,audio_url:url,by_name:nm});
 s.textContent=x.error?'Could not submit. Please try again.':'Thank you! Submitted for review.'+warn;if(!x.error)last=null}
async function imp(f){if(!f)return;const m=$('im'),wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]).map(r=>({en:String(r.English||r.english||'').trim(),ur:String(r.Urdu||r.urdu||'').trim()})).filter(r=>r.en);
 for(let i=0;i<rows.length;i+=300){const x=await SB.from('words').insert(rows.slice(i,i+300));if(x.error){m.textContent='Error: '+x.error.message;return}m.textContent='Imported '+Math.min(i+300,rows.length)}alert('Imported '+rows.length+' entries');load(true)}
async function ok(id){const s=subs.find(x=>x.id==id),u={};if(s.text)u.rohingya=s.text;if(s.audio_url)u.audio_url=s.audio_url;if(s.by_name)u.by_name=s.by_name;
 const x=await SB.from('words').update(u).eq('id',s.word_id);if(x.error){alert(x.error.message);return}await SB.from('submissions').delete().eq('id',id);load(true)}
async function rej(id){await SB.from('submissions').delete().eq('id',id);load(true)}
function Adm(){return `<h2>Admissions</h2><p class="mu">Courses and programs open for enrolment. Choose a program and apply online.</p>${admin?FORM('prog'):''}<div class="grid">${progs.map(p=>{const i=p.id;return `<div class="c"><span class="tag">Admissions</span><h3>${E(p.title)}</h3><div class="mu">${E([p.institution,p.deadline].filter(Boolean).join(' · '))}</div>${BD(p.body)}
<details><summary class="b" style="display:inline-block">Apply now</summary><input id="a_${i}_name" placeholder="Full name *"><input id="a_${i}_age" placeholder="Age"><input id="a_${i}_phone" placeholder="Phone or WhatsApp *"><input id="a_${i}_email" placeholder="Email (optional)"><input id="a_${i}_place" placeholder="Where do you live?">${p.extra_q?`<input id="a_${i}_extra" placeholder="${E(p.extra_q)}">`:''}<textarea id="a_${i}_msg" rows="3" placeholder="Message (optional)"></textarea><button class="b" onclick="apply('${i}')">Submit application</button> <span class="mu" id="as_${i}"></span><p class="mu">Your details are seen only by the administrator.</p></details>${ADM('prog',p)}</div>`}).join('')||'<div class="c mu">No programs are open right now.</div>'}</div>${admin?APPS():''}`}
async function apply(pid){const g=n=>($(`a_${pid}_${n}`)||{value:''}).value.trim(),s=$('as_'+pid);if(!g('name')||!g('phone')){s.textContent='Name and phone are required.';return}
 const x=await SB.from('applications').insert({program_id:pid,name:g('name'),age:g('age'),phone:g('phone'),email:g('email'),place:g('place'),extra_a:g('extra'),message:g('msg')});s.textContent=x.error?'Could not submit. Please try again.':'Thank you! Your application was received.'}
const pt=id=>(progs.find(p=>p.id==id)||{}).title||'';
function APPS(){return `<h2 style="margin-top:24px">Applications (${apps.length})</h2><button class="b" onclick="expApp()">Download CSV</button>${apps.map(a=>`<div class="c" style="margin-top:8px"><b>${E(a.name)}</b> <span class="mu">${E(pt(a.program_id))}</span><div>${E([a.age,a.phone,a.email,a.place].filter(Boolean).join(' · '))}</div>${a.extra_a?`<div class="mu">${E(a.extra_a)}</div>`:''}${a.message?`<div class="mu">${E(a.message)}</div>`:''}<button class="b r" onclick="delApp('${a.id}')">Delete</button></div>`).join('')}`}
async function delApp(id){if(confirm('Delete this application?')){await SB.from('applications').delete().eq('id',id);load(true)}}
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:ty}));a.download=n;a.click()}
function expApp(){const r=[['Program','Name','Age','Phone','Email','Place','Extra','Message','Date']].concat(apps.map(a=>[pt(a.program_id),a.name,a.age,a.phone,a.email,a.place,a.extra_a,a.message,a.created_at]));dl('applications.csv',r.map(x=>x.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function Inf(){return `<h2>Information</h2><p class="mu">Institutions and projects our founder works with.</p>${admin?FORM('org'):''}<div class="grid">${orgs.map(o=>`<div class="c">${o.role?`<span class="tag">${E(o.role)}</span>`:''}<h3>${E(o.name)}</h3>${BD(o.body)}${o.location?`<div class="mu">Location: ${E(o.location)}</div>`:''}${o.contact?`<div class="mu">Contact: ${E(o.contact)}</div>`:''}${/^https?:/.test(o.website||'')?`<a href="${E(o.website)}" target="_blank" rel="noopener">Visit website</a>`:''}${ADM('org',o)}</div>`).join('')||'<div class="c mu">Institution information will be published here.</div>'}</div>`}
function A(){if(!admin)return `<h2>Admin login</h2><div class="c"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="b" onclick="login()">Log in</button><p class="mu">${E(msg)}</p></div>`;
 return `<h2>Admin</h2><button class="b g" onclick="logout()">Log out</button><p class="mu">To add, edit or delete content, open any section from the menu and use the Add, Edit and Delete buttons there.</p>
<div class="c"><h3>Social media links</h3>${SOC.map(([k,l])=>`<input id="s_${k}" placeholder="${l} link (https://...)" value="${E(social[k]||'')}">`).join('')}<button class="b" onclick="saveSoc()">Save links</button></div>
<div class="c"><h3>Export approved dictionary</h3><button class="b" onclick="exp()">Download JSON</button></div>${seeded?'':'<div class="c"><h3>Starter articles</h3><button class="b" onclick="seed()">Import starter articles</button></div>'}`}
async function saveSoc(){const o={};SOC.forEach(([k])=>o[k]=$('s_'+k).value.trim());const x=await SB.from('site').upsert({key:'social',value:JSON.stringify(o)});alert(x.error?x.error.message:'Saved');load(true)}
function exp(){dl('rohingya-dictionary.json',JSON.stringify(words.filter(w=>w.rohingya).map(({id,created_at,...r})=>r),null,1),'application/json')}

async function logout(){await SB.auth.signOut()}
SB.auth.onAuthStateChange((e,s)=>{admin=!!s;load(e=='SIGNED_IN'||e=='SIGNED_OUT')});
draw();
